<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shanti Apa</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    font-family:'Segoe UI','Poppins',system-ui,sans-serif;
    user-select:none; -webkit-user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }

  /* TikTok vertical box — 714 x 1268 ratio */
  .video-box {
    position:relative;
    width:min(100vw, 714px);
    aspect-ratio:714 / 1268;
    max-height:100vh;
    background:#000;
    overflow:hidden;
    border-radius:18px;
    box-shadow:0 0 40px rgba(0,0,0,.9);
  }

  .video-box video {
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    pointer-events:none;      /* no click on video */
    background:#000;
  }

  /* invisible shield so clicks never reach video */
  .shield {
    position:absolute; inset:0;
    z-index:5;
    background:transparent;
  }

  /* ---------- POPUP ---------- */
  .popup-overlay {
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    background:rgba(0,0,0,.6);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    z-index:9999;
    opacity:0; visibility:hidden;
    transition:opacity .25s ease, visibility .25s ease;
    pointer-events:none;
  }
  .popup-overlay.show {
    opacity:1; visibility:visible;
    pointer-events:auto;
  }

  .popup {
    width:100%; max-width:380px;
    background:#1b1b26;
    border:2px solid #ffd966;
    border-radius:36px;
    padding:30px 22px 26px;
    text-align:center;
    color:#ffd966;
    font-weight:700;
    box-shadow:0 25px 60px rgba(0,0,0,.85), 0 0 25px rgba(255,217,102,.35);
    transform:scale(.9);
    transition:transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .popup-overlay.show .popup { transform:scale(1); }

  .popup .frog {
    font-size:3.2rem;
    line-height:1;
    margin-bottom:14px;
    display:block;
  }

  .popup .line1 {
    font-size:1.45rem;
    line-height:1.5;
    margin-bottom:8px;
    word-break:break-word;
  }
  .popup .line2 {
    font-size:1.2rem;
    line-height:1.5;
    color:#ffe9a8;
    margin-bottom:18px;
  }

  .popup .owner {
    font-size:1.05rem;
    color:#c9c9e0;
    font-weight:500;
    padding-top:16px;
    border-top:1px dashed #43435e;
    letter-spacing:.5px;
  }
  .popup .owner span { font-size:1.25rem; }

  .popup button {
    margin-top:22px;
    width:100%;
    padding:15px 0;
    font-size:1.15rem;
    font-weight:800;
    letter-spacing:1px;
    color:#1b1b26;
    background:linear-gradient(180deg,#ffe98a,#ffc93c);
    border:none;
    border-radius:60px;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(255,201,60,.45);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .popup button:active {
    transform:scale(.96);
    box-shadow:0 4px 10px rgba(255,201,60,.4);
  }

  /* black flash to corrupt screenshots */
  #blackout {
    position:fixed; inset:0;
    background:#000;
    z-index:99999;
    display:none;
  }
  #blackout.show { display:block; }

  /* sound hint (only if browser blocks unmute) */
  #soundHint {
    position:fixed;
    top:16px; left:50%;
    transform:translateX(-50%);
    background:#ffd966;
    color:#1b1b26;
    padding:9px 20px;
    border-radius:50px;
    font-size:.82rem;
    font-weight:800;
    letter-spacing:.4px;
    z-index:9998;
    box-shadow:0 6px 18px rgba(0,0,0,.5);
    pointer-events:none;
    transition:opacity .4s ease;
    white-space:nowrap;
  }
  #soundHint.hide { opacity:0; }
</style>
</head>
<body>

<div class="video-box">
  <!-- ⬇️把你的 mp4 视频放到同一个文件夹，并把文件名改成下面 src 中的名字 -->
  <video
    id="video"
    src="protected-video.mp4"
    autoplay
    muted
    loop
    playsinline
    webkit-playsinline
    preload="auto"
    disablepictureinpicture
    controlslist="nodownload noplaybackrate noremoteplayback nofullscreen"
  ></video>
  <div class="shield"></div>
</div>

<div id="soundHint">🔊 Tap to enable sound</div>

<!-- POPUP -->
<div class="popup-overlay" id="popupOverlay">
  <div class="popup">
    <span class="frog">🐸😂</span>
    <div class="line1">ভাই ভিডিও থামানো বা<br>স্ক্রিনশট মারা যাবেনা 🐸</div>
    <div class="line2">ভাই রাগলেন 🐸😂</div>
    <div class="owner">Owner <span>Shanti Apa🙂</span></div>
    <button id="okBtn">OK</button>
  </div>
</div>

<div id="blackout"></div>

<script>
(function(){
  const video      = document.getElementById('video');
  const overlay    = document.getElementById('popupOverlay');
  const blackout   = document.getElementById('blackout');
  const okBtn      = document.getElementById('okBtn');
  const soundHint  = document.getElementById('soundHint');

  let soundOn = false;
  let popupTimer = null;

  /* ---------- 1. AUTO PLAY + LOOP + SOUND ----------
     Browser blocks autoplay with sound until user interacts.
     Strategy: autoplay muted (works everywhere) → unmute on
     first user tap/click/key. If browser allows, unmute instantly. */
  function playVideo(){
    const p = video.play();
    if (p && p.catch) p.catch(()=>{});
  }

  function unmute(){
    if (soundOn) return;
    soundOn = true;
    video.muted = false;
    video.volume = 1;
    playVideo();
    soundHint.classList.add('hide');
  }

  // try instant unmute (some browsers allow)
  window.addEventListener('load', () => {
    video.muted = false;
    playVideo();
    if (!video.paused && !video.muted) soundHint.classList.add('hide');
    else {
      video.muted = true;
      playVideo();
    }
  });

  // unmute on first user action
  ['pointerdown','touchstart','click','keydown'].forEach(evt=>{
    document.addEventListener(evt, unmute, { passive:true });
  });

  // keep playing forever (loop already set, but guard against pauses)
  video.addEventListener('pause', () => {
    playVideo();
  });
  video.addEventListener('ended', () => {
    video.currentTime = 0;
    playVideo();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      playVideo();
      if (soundOn) { video.muted = false; video.volume = 1; }
    }
  });

  // extra guard: re-play if paused for any reason every 1.5s
  setInterval(() => {
    if (video.paused) playVideo();
  }, 1500);

  /* ---------- 2. POPUP ---------- */
  function showPopup(){
    overlay.classList.add('show');
    if (popupTimer) clearTimeout(popupTimer);
    // no auto hide — user must click OK (as requested)
  }
  function hidePopup(){
    overlay.classList.remove('show');
    if (popupTimer) { clearTimeout(popupTimer); popupTimer = null; }
  }
  okBtn.addEventListener('click', hidePopup);

  /* ---------- 3. SCREENSHOT DETECTION ---------- */
  function blockScreenshot(){
    showPopup();
    // flash black to corrupt screenshot
    blackout.classList.add('show');
    setTimeout(()=>blackout.classList.remove('show'), 1300);
    // wipe clipboard if possible
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText('').catch(()=>{});
    }
  }

  // PrintScreen key
  window.addEventListener('keydown', e=>{
    if (e.key === 'PrintScreen' || e.keyCode === 44){
      e.preventDefault(); blockScreenshot(); return false;
    }
  }, { capture:true });
  window.addEventListener('keyup', e=>{
    if (e.key === 'PrintScreen' || e.keyCode === 44){
      e.preventDefault(); blockScreenshot(); return false;
    }
  }, { capture:true });

  // blur (screenshot tools) detection
  let lastBlur = 0;
  window.addEventListener('blur', ()=>{
    const now = Date.now();
    if (now - lastBlur > 300 && document.visibilityState === 'visible'){
      blockScreenshot();
    }
    lastBlur = now;
  });
  document.addEventListener('visibilitychange', ()=>{
    if (document.visibilityState === 'visible'){
      const now = Date.now();
      if (now - lastBlur < 600 && lastBlur > 0) blockScreenshot();
    }
  });

  /* ---------- 4. BLOCK CLICK / CONTEXT / COPY ---------- */
  window.addEventListener('contextmenu', e=>{
    e.preventDefault(); e.stopPropagation(); return false;
  }, { capture:true });

  window.addEventListener('auxclick', e=>{
    e.preventDefault(); e.stopPropagation(); return false;
  }, { capture:true });

  document.addEventListener('selectstart', e=>e.preventDefault());
  document.addEventListener('dragstart',   e=>e.preventDefault());

  document.addEventListener('copy', e=>{
    e.preventDefault(); blockScreenshot(); return false;
  });
  document.addEventListener('cut', e=>{ e.preventDefault(); return false; });

  /* ---------- 5. LONG PRESS → POPUP ---------- */
  let pressTimer = null;
  const LONG_PRESS = 550;

  function startPress(e){
    if (e.button && e.button !== 0) return;
    if (pressTimer) clearTimeout(pressTimer);
    pressTimer = setTimeout(()=>{
      showPopup();
      if (navigator.vibrate) navigator.vibrate(35);
      pressTimer = null;
    }, LONG_PRESS);
  }
  function cancelPress(){
    if (pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
  }

  document.addEventListener('mousedown', startPress, { passive:false });
  document.addEventListener('mouseup',   cancelPress);
  document.addEventListener('mouseleave',cancelPress);
  document.addEventListener('touchstart', e=>{
    if (e.touches.length === 1) startPress(e);
  }, { passive:true });
  document.addEventListener('touchend',   cancelPress);
  document.addEventListener('touchcancel',cancelPress);
  document.addEventListener('touchmove',  cancelPress, { passive:true });

  /* prevent popup from closing accidentally inside card */
  document.querySelector('.popup').addEventListener('click', e=>e.stopPropagation());
  overlay.addEventListener('click', e=>{
    if (e.target === overlay) hidePopup();
  });

  /* ---------- 6. Disable mute / pause via any media keys (best effort) ---------- */
  window.addEventListener('keydown', e=>{
    // space / k / m / arrow keys that could pause or mute
    const block = [' ','k','K','m','M','MediaPlayPause','MediaTrackNext','MediaTrackPrevious'];
    if (block.includes(e.key)) {
      e.preventDefault();
      if (e.key === 'm' || e.key === 'M') unmute();
      playVideo();
      return false;
    }
  }, { capture:true });

})();
</script>
</body>
</html>
